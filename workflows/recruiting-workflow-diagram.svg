<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1740" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1740" fill="#f8f9fc"/><rect x="0" y="0" width="1000" height="80" fill="#1a2e4a"/><text x="500" y="30" text-anchor="middle" fill="white" font-size="20" font-weight="bold">End-to-End Recruiting Workflow</text><text x="500" y="58" text-anchor="middle" fill="#a8c4e0" font-size="13">TA Systems Playbook - HCWhite26</text><rect x="30" y="95" width="940" height="38" rx="6" fill="#e8eef5" stroke="#c5d3e0" stroke-width="1"/><rect x="50" y="107" width="16" height="16" rx="3" fill="#1a73e8"/><text x="72" y="119" fill="#333" font-size="11">Process Step</text><rect x="160" y="107" width="16" height="16" rx="3" fill="#34a853"/><text x="182" y="119" fill="#333" font-size="11">Decision / Gate</text><rect x="290" y="107" width="16" height="16" rx="3" fill="#fbbc04"/><text x="312" y="119" fill="#333" font-size="11">ATS Routing</text><rect x="420" y="107" width="16" height="16" rx="3" fill="#ea4335"/><text x="442" y="119" fill="#333" font-size="11">Exit / Decline</text><rect x="540" y="107" width="16" height="16" rx="3" fill="#9334e6"/><text x="562" y="119" fill="#333" font-size="11">Offer Stage</text><rect x="650" y="107" width="16" height="16" rx="3" fill="#0f9d58"/><text x="672" y="119" fill="#333" font-size="11">Hire / Close</text><rect x="30" y="148" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="164" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 1 - INTAKE AND ALIGNMENT</text><rect x="350" y="185" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="205" text-anchor="middle" fill="white" font-size="13" font-weight="bold">1. HC Request Submitted</text><text x="500" y="223" text-anchor="middle" fill="#d0e4ff" font-size="11">HM submits headcount request to HR / Finance / Leadership</text><line x1="500" y1="237" x2="500" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,258 630,290 500,322 370,290" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="285" text-anchor="middle" fill="white" font-size="12" font-weight="bold">HC Approved?</text><text x="500" y="301" text-anchor="middle" fill="#cdffd8" font-size="10">Budget / headcount confirmed</text><line x1="370" y1="290" x2="200" y2="290" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="270" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="287" text-anchor="middle" fill="white" font-size="11" font-weight="bold">On Hold / Cancel</text><text x="130" y="301" text-anchor="middle" fill="#ffd0ce" font-size="10">Notify HM and stakeholders</text><text x="290" y="285" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="322" x2="500" y2="348" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="339" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="350" y="348" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="368" text-anchor="middle" fill="white" font-size="13" font-weight="bold">2. Req Created in ATS</text><text x="500" y="386" text-anchor="middle" fill="#d0e4ff" font-size="11">HM or HRBP opens approved req in Greenhouse / Workday</text><line x1="500" y1="400" x2="500" y2="426" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="426" width="300" height="52" rx="8" fill="#fbbc04" stroke="#e0a800" stroke-width="1.5"/><text x="500" y="446" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">3. ATS Routes Req to Recruiter</text><text x="500" y="464" text-anchor="middle" fill="#554400" font-size="11">Automated assignment or TA lead allocation</text><line x1="500" y1="478" x2="500" y2="504" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="504" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="524" text-anchor="middle" fill="white" font-size="13" font-weight="bold">4. Recruiter Intake Meeting</text><text x="500" y="542" text-anchor="middle" fill="#d0e4ff" font-size="11">Align on profile, timeline, priority, and success criteria</text><line x1="500" y1="556" x2="500" y2="582" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="582" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="598" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 2 - SOURCING AND PIPELINE BUILDING</text><rect x="350" y="619" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="639" text-anchor="middle" fill="white" font-size="13" font-weight="bold">5. Job Posted + Active Sourcing</text><text x="500" y="657" text-anchor="middle" fill="#d0e4ff" font-size="11">LinkedIn, Boolean search, referrals, ATS database</text><rect x="710" y="619" width="200" height="52" rx="8" fill="#7b2fff" stroke="#5a1fb8" stroke-width="1.5"/><text x="810" y="636" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AI-Assisted Sourcing</text><text x="810" y="652" text-anchor="middle" fill="#ddd0ff" font-size="10">Signal mapping and prompt</text><text x="810" y="664" text-anchor="middle" fill="#ddd0ff" font-size="10">engineering for fit</text><line x1="710" y1="645" x2="650" y2="645" stroke="#7b2fff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/><line x1="500" y1="671" x2="500" y2="697" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="697" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="717" text-anchor="middle" fill="white" font-size="13" font-weight="bold">6. Resume Review and Screening</text><text x="500" y="735" text-anchor="middle" fill="#d0e4ff" font-size="11">Signal-based evaluation against calibrated criteria</text><line x1="500" y1="749" x2="500" y2="775" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,775 630,807 500,839 370,807" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="802" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Strong Signal?</text><text x="500" y="818" text-anchor="middle" fill="#cdffd8" font-size="10">Meets must-haves</text><line x1="370" y1="807" x2="200" y2="807" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="787" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="804" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Declined</text><text x="130" y="818" text-anchor="middle" fill="#ffd0ce" font-size="10">Disposition in ATS</text><text x="290" y="802" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="839" x2="500" y2="865" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="856" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="30" y="865" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="881" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 3 - SCREENING AND EVALUATION</text><rect x="350" y="902" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="922" text-anchor="middle" fill="white" font-size="13" font-weight="bold">7. Recruiter Phone Screen</text><text x="500" y="940" text-anchor="middle" fill="#d0e4ff" font-size="11">Motivation, availability, comp, core fit signals</text><line x1="500" y1="954" x2="500" y2="980" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,980 630,1012 500,1044 370,1012" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="1007" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Advance to HM?</text><text x="500" y="1023" text-anchor="middle" fill="#cdffd8" font-size="10">Calibration check</text><line x1="370" y1="1012" x2="200" y2="1012" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="992" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="1009" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Not a Fit</text><text x="130" y="1023" text-anchor="middle" fill="#ffd0ce" font-size="10">Candidate notified</text><text x="290" y="1007" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="1044" x2="500" y2="1070" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="1061" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="350" y="1070" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="1090" text-anchor="middle" fill="white" font-size="13" font-weight="bold">8. Hiring Manager Interview</text><text x="500" y="1108" text-anchor="middle" fill="#d0e4ff" font-size="11">Technical fit, team dynamics, role-specific depth</text><line x1="500" y1="1122" x2="500" y2="1148" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="1148" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="1168" text-anchor="middle" fill="white" font-size="13" font-weight="bold">9. Panel / Final Interviews</text><text x="500" y="1186" text-anchor="middle" fill="#d0e4ff" font-size="11">Structured scorecard; debrief within 24 hrs</text><line x1="500" y1="1200" x2="500" y2="1226" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,1226 630,1258 500,1290 370,1258" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="1253" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Hire Decision?</text><text x="500" y="1269" text-anchor="middle" fill="#cdffd8" font-size="10">Debrief consensus</text><line x1="370" y1="1258" x2="200" y2="1258" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="1238" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="1255" text-anchor="middle" fill="white" font-size="11" font-weight="bold">No Hire</text><text x="130" y="1269" text-anchor="middle" fill="#ffd0ce" font-size="10">Feedback documented</text><text x="290" y="1253" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="1290" x2="500" y2="1316" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="1307" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="30" y="1316" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="1332" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 4 - OFFER AND CLOSE</text><rect x="350" y="1353" width="300" height="52" rx="8" fill="#9334e6" stroke="#6a1fb0" stroke-width="1.5"/><text x="500" y="1373" text-anchor="middle" fill="white" font-size="13" font-weight="bold">10. Offer Preparation</text><text x="500" y="1391" text-anchor="middle" fill="#e8d0ff" font-size="11">Comp benchmarking, approval chain, offer letter</text><line x1="500" y1="1405" x2="500" y2="1431" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="1431" width="300" height="52" rx="8" fill="#9334e6" stroke="#6a1fb0" stroke-width="1.5"/><text x="500" y="1451" text-anchor="middle" fill="white" font-size="13" font-weight="bold">11. Verbal Offer Extended</text><text x="500" y="1469" text-anchor="middle" fill="#e8d0ff" font-size="11">Recruiter delivers; negotiate if needed</text><line x1="500" y1="1483" x2="500" y2="1509" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,1509 630,1541 500,1573 370,1541" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="1536" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Offer Accepted?</text><text x="500" y="1552" text-anchor="middle" fill="#cdffd8" font-size="10">Written confirmation received</text><line x1="370" y1="1541" x2="200" y2="1541" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="1521" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="1538" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Declined</text><text x="130" y="1552" text-anchor="middle" fill="#ffd0ce" font-size="10">Return to pipeline</text><text x="290" y="1536" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="1573" x2="500" y2="1599" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="1590" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="350" y="1599" width="300" height="52" rx="8" fill="#0f9d58" stroke="#0a6e3c" stroke-width="1.5"/><text x="500" y="1619" text-anchor="middle" fill="white" font-size="13" font-weight="bold">12. Onboarding Handoff</text><text x="500" y="1637" text-anchor="middle" fill="#c0ffe0" font-size="11">HRIS update - IT provisioning - 30/60/90 plan</text><line x1="500" y1="1651" x2="500" y2="1677" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="1677" width="300" height="52" rx="8" fill="#0f9d58" stroke="#0a6e3c" stroke-width="2.5"/><text x="500" y="1699" text-anchor="middle" fill="white" font-size="14" font-weight="bold">HIRE COMPLETE</text><text x="500" y="1717" text-anchor="middle" fill="#c0ffe0" font-size="11">Close req - Log metrics - Run retrospective</text><rect x="0" y="1730" width="1000" height="10" fill="#1a2e4a"/><text x="500" y="1739" text-anchor="middle" fill="#a8c4e0" font-size="9">TA Systems Playbook - github.com/HCWhite26 - End-to-End Recruiting Workflow</text><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea4335"/></marker><marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7b2fff"/></marker></defs></svg>
