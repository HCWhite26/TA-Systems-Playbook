<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1600" fill="#f8f9fc"/><rect x="0" y="0" width="1000" height="80" fill="#1a2e4a"/><text x="500" y="30" text-anchor="middle" fill="white" font-size="20" font-weight="bold">End-to-End Recruiting Workflow</text><text x="500" y="58" text-anchor="middle" fill="#a8c4e0" font-size="13">TA Systems Playbook - HCWhite26</text><rect x="30" y="95" width="940" height="38" rx="6" fill="#e8eef5" stroke="#c5d3e0" stroke-width="1"/><rect x="50" y="107" width="16" height="16" rx="3" fill="#1a73e8"/><text x="72" y="119" fill="#333" font-size="11">Process Step</text><rect x="160" y="107" width="16" height="16" rx="3" fill="#34a853"/><text x="182" y="119" fill="#333" font-size="11">Decision / Gate</text><rect x="290" y="107" width="16" height="16" rx="3" fill="#fbbc04"/><text x="312" y="119" fill="#333" font-size="11">Handoff / Action</text><rect x="420" y="107" width="16" height="16" rx="3" fill="#ea4335"/><text x="442" y="119" fill="#333" font-size="11">Exit / Decline</text><rect x="540" y="107" width="16" height="16" rx="3" fill="#9334e6"/><text x="562" y="119" fill="#333" font-size="11">Offer Stage</text><rect x="650" y="107" width="16" height="16" rx="3" fill="#0f9d58"/><text x="672" y="119" fill="#333" font-size="11">Hire / Close</text><rect x="30" y="148" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="164" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 1 - INTAKE AND ALIGNMENT</text><rect x="350" y="185" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="207" text-anchor="middle" fill="white" font-size="13" font-weight="bold">1. Requisition Received</text><text x="500" y="225" text-anchor="middle" fill="#d0e4ff" font-size="11">HM submits req via ATS (Greenhouse/Workday)</text><line x1="500" y1="237" x2="500" y2="263" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="263" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="284" text-anchor="middle" fill="white" font-size="13" font-weight="bold">2. Intake Meeting</text><text x="500" y="302" text-anchor="middle" fill="#d0e4ff" font-size="11">Recruiter + HM align on profile, timeline, priority</text><line x1="500" y1="315" x2="500" y2="341" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,341 630,373 500,405 370,373" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="370" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Req Approved?</text><text x="500" y="386" text-anchor="middle" fill="#cdffd8" font-size="10">HC / Budget confirmed</text><line x1="370" y1="373" x2="200" y2="373" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="353" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="370" text-anchor="middle" fill="white" font-size="11" font-weight="bold">On Hold / Cancel</text><text x="130" y="384" text-anchor="middle" fill="#ffd0ce" font-size="10">Notify stakeholders</text><text x="290" y="368" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="405" x2="500" y2="431" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="422" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="30" y="431" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="447" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 2 - SOURCING AND PIPELINE BUILDING</text><rect x="350" y="468" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="488" text-anchor="middle" fill="white" font-size="13" font-weight="bold">3. Job Posted + Active Sourcing</text><text x="500" y="506" text-anchor="middle" fill="#d0e4ff" font-size="11">LinkedIn, Boolean search, referrals, ATS database</text><rect x="710" y="468" width="200" height="52" rx="8" fill="#7b2fff" stroke="#5a1fb8" stroke-width="1.5"/><text x="810" y="488" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AI-Assisted Sourcing</text><text x="810" y="504" text-anchor="middle" fill="#ddd0ff" font-size="10">Prompt engineering and signal</text><text x="810" y="516" text-anchor="middle" fill="#ddd0ff" font-size="10">mapping for candidate fit</text><line x1="710" y1="494" x2="650" y2="494" stroke="#7b2fff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/><line x1="500" y1="520" x2="500" y2="546" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="546" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="566" text-anchor="middle" fill="white" font-size="13" font-weight="bold">4. Resume Review and Screening</text><text x="500" y="584" text-anchor="middle" fill="#d0e4ff" font-size="11">Signal-based evaluation against calibrated criteria</text><line x1="500" y1="598" x2="500" y2="624" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,624 630,656 500,688 370,656" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="651" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Strong Signal?</text><text x="500" y="667" text-anchor="middle" fill="#cdffd8" font-size="10">Meets must-haves</text><line x1="370" y1="656" x2="200" y2="656" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="636" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="653" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Declined</text><text x="130" y="667" text-anchor="middle" fill="#ffd0ce" font-size="10">Disposition in ATS</text><text x="290" y="651" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="688" x2="500" y2="714" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="705" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="30" y="714" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="730" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 3 - SCREENING AND EVALUATION</text><rect x="350" y="751" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="771" text-anchor="middle" fill="white" font-size="13" font-weight="bold">5. Recruiter Phone Screen</text><text x="500" y="789" text-anchor="middle" fill="#d0e4ff" font-size="11">Motivation, availability, comp, core fit signals</text><line x1="500" y1="803" x2="500" y2="829" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,829 630,861 500,893 370,861" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="856" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Advance to HM?</text><text x="500" y="872" text-anchor="middle" fill="#cdffd8" font-size="10">Calibration check</text><line x1="370" y1="861" x2="200" y2="861" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="841" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="858" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Not a Fit</text><text x="130" y="872" text-anchor="middle" fill="#ffd0ce" font-size="10">Candidate notified</text><text x="290" y="856" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="893" x2="500" y2="919" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="910" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="350" y="919" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="939" text-anchor="middle" fill="white" font-size="13" font-weight="bold">6. Hiring Manager Interview</text><text x="500" y="957" text-anchor="middle" fill="#d0e4ff" font-size="11">Technical fit, team dynamics, role-specific depth</text><line x1="500" y1="971" x2="500" y2="997" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="997" width="300" height="52" rx="8" fill="#1a73e8" stroke="#1558b0" stroke-width="1.5"/><text x="500" y="1017" text-anchor="middle" fill="white" font-size="13" font-weight="bold">7. Panel / Final Interviews</text><text x="500" y="1035" text-anchor="middle" fill="#d0e4ff" font-size="11">Structured scorecard; debrief within 24 hrs</text><line x1="500" y1="1049" x2="500" y2="1075" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,1075 630,1107 500,1139 370,1107" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="1102" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Hire Decision?</text><text x="500" y="1118" text-anchor="middle" fill="#cdffd8" font-size="10">Debrief consensus</text><line x1="370" y1="1107" x2="200" y2="1107" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="1087" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="1104" text-anchor="middle" fill="white" font-size="11" font-weight="bold">No Hire</text><text x="130" y="1118" text-anchor="middle" fill="#ffd0ce" font-size="10">Feedback documented</text><text x="290" y="1102" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="1139" x2="500" y2="1165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="1156" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="30" y="1165" width="940" height="24" rx="4" fill="#1a2e4a"/><text x="500" y="1181" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PHASE 4 - OFFER AND CLOSE</text><rect x="350" y="1202" width="300" height="52" rx="8" fill="#9334e6" stroke="#6a1fb0" stroke-width="1.5"/><text x="500" y="1222" text-anchor="middle" fill="white" font-size="13" font-weight="bold">8. Offer Preparation</text><text x="500" y="1240" text-anchor="middle" fill="#e8d0ff" font-size="11">Comp benchmarking, approval chain, offer letter</text><line x1="500" y1="1254" x2="500" y2="1280" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="1280" width="300" height="52" rx="8" fill="#9334e6" stroke="#6a1fb0" stroke-width="1.5"/><text x="500" y="1300" text-anchor="middle" fill="white" font-size="13" font-weight="bold">9. Verbal Offer Extended</text><text x="500" y="1318" text-anchor="middle" fill="#e8d0ff" font-size="11">Recruiter delivers; negotiate if needed</text><line x1="500" y1="1332" x2="500" y2="1358" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polygon points="500,1358 630,1390 500,1422 370,1390" fill="#34a853" stroke="#1e7e34" stroke-width="1.5"/><text x="500" y="1385" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Offer Accepted?</text><text x="500" y="1401" text-anchor="middle" fill="#cdffd8" font-size="10">Written confirmation</text><line x1="370" y1="1390" x2="200" y2="1390" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowRed)"/><rect x="60" y="1370" width="140" height="40" rx="6" fill="#ea4335" stroke="#b31412" stroke-width="1.5"/><text x="130" y="1387" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Declined</text><text x="130" y="1401" text-anchor="middle" fill="#ffd0ce" font-size="10">Return to pipeline</text><text x="290" y="1385" fill="#ea4335" font-size="11" font-weight="bold">No</text><line x1="500" y1="1422" x2="500" y2="1448" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="515" y="1439" fill="#34a853" font-size="11" font-weight="bold">Yes</text><rect x="350" y="1448" width="300" height="52" rx="8" fill="#0f9d58" stroke="#0a6e3c" stroke-width="1.5"/><text x="500" y="1468" text-anchor="middle" fill="white" font-size="13" font-weight="bold">10. Onboarding Handoff</text><text x="500" y="1486" text-anchor="middle" fill="#c0ffe0" font-size="11">HRIS update - IT provisioning - 30/60/90 plan</text><line x1="500" y1="1500" x2="500" y2="1526" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="1526" width="300" height="52" rx="8" fill="#0f9d58" stroke="#0a6e3c" stroke-width="2.5"/><text x="500" y="1548" text-anchor="middle" fill="white" font-size="14" font-weight="bold">HIRE COMPLETE</text><text x="500" y="1566" text-anchor="middle" fill="#c0ffe0" font-size="11">Close req - Log metrics - Run retrospective</text><rect x="0" y="1585" width="1000" height="15" fill="#1a2e4a"/><text x="500" y="1596" text-anchor="middle" fill="#a8c4e0" font-size="9">TA Systems Playbook - github.com/HCWhite26 - End-to-End Recruiting Workflow</text><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea4335"/></marker><marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7b2fff"/></marker></defs></svg>
